name: Library Management CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build - install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Automated testing
        run: python -m unittest -v

      - name: Code quality check
        run: ruff check app.py test_app.py --output-format=github

      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered."
          else
            echo "Deployment skipped: add RENDER_DEPLOY_HOOK_URL in GitHub repository secrets."
          fi
